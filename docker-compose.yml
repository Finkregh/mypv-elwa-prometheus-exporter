version: "3.8"

services:
  mypv-elwa-exporter:
    image: git.h.oluflorenzen.de/finkregh/mypv-ac-elwa-exporter:latest
    container_name: mypv-elwa-prometheus-exporter
    environment:
      # Serve command environment variables
      - MYPVELWAEXPORTER_SERVE_URL=http://192.168.178.125 # Adjust to your my-PV AC ELWA device URL(s)
      - MYPVELWAEXPORTER_SERVE_PORT=8000 # Port to serve metrics on
      - MYPVELWAEXPORTER_SERVE_LOG_LEVEL=INFO # Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
      # Uncomment to log to a file
      # - MYPVELWAEXPORTER_SERVE_LOG_FILE=/app/logs/exporter.log
    ports:
      - "8000:8000" # Expose metrics endpoint
    restart: unless-stopped
    # Uncomment the following lines if you want to save logs to a file
    # volumes:
    #   - ./logs:/app/logs

    # Optional: Add to same network as your monitoring stack
    # networks:
    #   - monitoring

  # Alternative: Export mode for one-time metrics collection
  # mypv-elwa-exporter-export:
  #   image: git.h.oluflorenzen.de/finkregh/mypv-ac-elwa-exporter:latest
  #   container_name: mypv-elwa-prometheus-exporter-export
  #   environment:
  #     # Export command environment variables
  #     - MYPVELWAEXPORTER_EXPORT_URL=http://192.168.178.125  # Adjust to your device URL(s)
  #     - MYPVELWAEXPORTER_EXPORT_LOG_LEVEL=INFO               # Logging level
  #     # Uncomment to save metrics to a file instead of stdout
  #     # - MYPVELWAEXPORTER_EXPORT_OUTPUT=/app/metrics/mypv_metrics.txt
  #   command: ["mypv-elwa-prometheus-exporter", "export"]
  #   # Uncomment the following lines if you want to save metrics to a file
  #   # volumes:
  #   #   - ./metrics:/app/metrics
  #   # restart: "no"  # Run once

# Uncomment if you need to create a custom network
# networks:
#   monitoring:
#     external: true
