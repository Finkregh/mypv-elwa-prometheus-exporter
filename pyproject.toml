[project]
name = "mypv-elwa-prometheus-exporter"
version = "1.0.0"
description = "A Python script that exports my-PV AC ELWA device statistics as Prometheus metrics"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oluf Lorenzen" }]
keywords = [
  "mypv",
  "ac-elwa",
  "prometheus",
  "metrics",
  "exporter",
  "monitoring",
  "solar",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
  "Topic :: Home Automation",
]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.9.0",
  "requests>=2.25.0",
  "rich>=10.0.0",
  "prometheus-client>=0.22.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=6.0.0",
  "responses>=0.20.0",
  "black>=22.0.0",
  "isort>=5.10.0",
  "mypy>=1.0.0",
  "types-requests>=2.25.0",
]

[project.urls]
Homepage = "https://git.h.oluflorenzen.de/finkregh/mypv-elwa-prometheus-exporter"
Repository = "https://git.h.oluflorenzen.de/finkregh/mypv-elwa-prometheus-exporter"
Issues = "https://git.h.oluflorenzen.de/finkregh/mypv-elwa-prometheus-exporter/issues"

[project.scripts]
mypv-elwa-prometheus-exporter = "mypv_elwa_prometheus_exporter:app"

[build-system]
requires = ["uv_build>=0.8.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "black>=25.1.0",
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "responses>=0.25.8",
  "ty>=0.0.40",
  "typing-extensions>=4.14.1",
]

[tool.black]
line-length = 119
target-version = ['py314']
include = '\.pyi?$'

[tool.ruff]
line-length = 119
# ruff does not read the python version from setup.py
target-version = "py314"
exclude = ["stubs", "ci_helper"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D407",    # Missing dashed underline after section ("Returns") # formatting docstrings
  "FA102",   # future-required-type-annotation (FA102) # we dont use old python
  "FA100",   # see above
  "UP015",   # Unnecessary open mode parameters
  "PTH123",  # `open()` should be replaced by `Path.open()`
  "C901",
  "PLR0911",
  "PLR0912", # complexity
  "ANN002",
  "ANN003",  # typig for args/kwargs
  "T201", # print for stats
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  # at least this three should be fine in tests:
  "S101", # asserts allowed in tests...
  "ARG",  # Unused function args -> fixtures nevertheless are functionally relevant...
  "FBT",  # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
  # The below are debateable
  "PLR2004", # Magic value used in comparison, ...
  "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
  "ANN101",  # missing-type-self # TODO: set proper type hints
  "ANN001",
  "ANN201",
  "E501",    # line too long, often used log checks, mocks, ...
  "SLF001",  # Private member accessed
]
"stubs/**" = [
  "ALL", # no checks for the autogenerated stubs
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
